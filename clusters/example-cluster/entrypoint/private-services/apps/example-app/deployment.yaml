apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app
  namespace: private-services
  labels:
    app.kubernetes.io/name: example-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-app
    spec:
      containers:
        - name: example-app
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          command: ["./podinfo", "--port=9898", "--level=info"]
          ports:
            - name: http
              containerPort: 9898
              protocol: TCP
          livenessProbe:
            exec:
              command: ["podcli", "check", "http", "localhost:9898/healthz"]
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["podcli", "check", "http", "localhost:9898/readyz"]
            initialDelaySeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 2000m
              memory: 512Mi
