apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubecrate-vanilla
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./compositions/vanilla/entrypoint
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubecrate-upstream
  timeout: 10m0s
  wait: true
