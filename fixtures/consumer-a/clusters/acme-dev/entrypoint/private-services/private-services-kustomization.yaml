apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: private-services
  namespace: flux-system
spec:
  dependsOn:
    - name: kubecrate-vanilla
  interval: 10m0s
  path: ./clusters/acme-dev/entrypoint/private-services/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: true
