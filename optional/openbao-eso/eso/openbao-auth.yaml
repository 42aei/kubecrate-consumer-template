apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-openbao-auth
  namespace: core-external-secrets-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-openbao-auth-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: eso-openbao-auth
    namespace: core-external-secrets-operator
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://ob.int.anov.io
      path: bedrock-kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes/bedrock-REPLACE_WITH_CLUSTER
          role: eso-read
          serviceAccountRef:
            name: eso-openbao-auth
            namespace: core-external-secrets-operator
            audiences:
              - openbao
              - https://kubernetes.default.svc.cluster.local
