apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-mgmt-api-key
  namespace: core-netbird-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netbird-mgmt-api-key
    creationPolicy: Owner
  data:
    - secretKey: NB_API_KEY
      remoteRef:
        key: tenants/REPLACE_WITH_CLUSTER/netbird-operator
        property: NB_API_KEY
