apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: kubecrate-vanilla
  interval: 10m0s
  path: ./platform-services/netbird-operator/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system-sync
  timeout: 5m0s
  wait: false
  patches:
    - target:
        kind: HelmRelease
        name: netbird-operator
      patch: |
        - op: add
          path: /spec/values
          value:
            cluster:
              name: REPLACE_WITH_CLUSTER
