apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-api-key
  namespace: flux-system
spec:
  dependsOn:
    - name: netbird-operator
    - name: eso-openbao
  interval: 10m0s
  path: ./clusters/REPLACE_WITH_CLUSTER/entrypoint/platform-services/netbird/api-key
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: false
  # Explicit checks gate app access on Secret sync and operator readiness.
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: netbird-mgmt-api-key
      namespace: core-netbird-operator
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: netbird-operator
      namespace: core-netbird-operator
