apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-public
  namespace: private-services
spec:
  parentRefs:
    - name: public
      namespace: core-netbird-operator
  hostnames:
    - example-public.REPLACE_WITH_PUBLIC_DOMAIN
  rules:
    - backendRefs:
        - name: example-public
          port: 80
