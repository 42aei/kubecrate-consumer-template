apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-collector-auth
  namespace: openobserve
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openobserve-collector-auth
    creationPolicy: Owner
    # The collectors send the root user's `Basic email:token`. OpenObserve accepts that token only
    # on ingestion paths. The HelmRelease injects key `authorization` as env OPENOBSERVE_AUTH.
    template:
      engineVersion: v2
      data:
        authorization: 'Basic {{ printf "%s:%s" .email .token | b64enc }}'
  data:
    - secretKey: email
      remoteRef:
        key: tenants/REPLACE_WITH_CLUSTER/openobserve/root-user
        property: email
    - secretKey: token
      remoteRef:
        key: tenants/REPLACE_WITH_CLUSTER/openobserve/root-user
        property: token
