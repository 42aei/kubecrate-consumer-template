apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: opentelemetry-operator
  namespace: flux-system
spec:
  # cert-manager: the Kustomization of the default Vanilla composition that reconciles cert-manager.
  dependsOn:
    - name: cert-manager
  interval: 10m0s
  path: ./clusters/REPLACE_WITH_CLUSTER/entrypoint/private-services/openobserve/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: true
