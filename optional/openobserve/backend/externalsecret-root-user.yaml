apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-root-user
  namespace: openobserve
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openobserve-root-user
    creationPolicy: Owner
  data:
    - secretKey: ZO_ROOT_USER_EMAIL
      remoteRef:
        key: tenants/REPLACE_WITH_CLUSTER/openobserve/root-user
        property: email
    - secretKey: ZO_ROOT_USER_PASSWORD
      remoteRef:
        key: tenants/REPLACE_WITH_CLUSTER/openobserve/root-user
        property: password
    - secretKey: ZO_ROOT_USER_TOKEN
      remoteRef:
        key: tenants/REPLACE_WITH_CLUSTER/openobserve/root-user
        property: token
