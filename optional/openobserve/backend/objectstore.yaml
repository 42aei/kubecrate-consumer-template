apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: openobserve-meta-backups
  namespace: openobserve
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://REPLACE_WITH_BACKUP_BUCKET/openobserve-meta/
    endpointURL: https://REPLACE_WITH_S3_ENDPOINT
    s3Credentials:
      accessKeyId:
        name: openobserve-backup
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: openobserve-backup
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # S3-compatible stores that reject the AWS SDK's default checksums need these two.
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
      - name: AWS_DEFAULT_REGION
        value: REPLACE_WITH_S3_REGION
