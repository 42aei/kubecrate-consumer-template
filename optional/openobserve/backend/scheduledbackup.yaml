apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: openobserve-meta-daily
  namespace: openobserve
spec:
  # Six fields, seconds first: every day at 02:00:00.
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  cluster:
    name: openobserve-meta
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
