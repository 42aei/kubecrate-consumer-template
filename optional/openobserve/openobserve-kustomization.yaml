apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openobserve
  namespace: flux-system
spec:
  # eso-openbao: External Secrets Operator and the ClusterSecretStore (optional/openbao-eso/).
  # cnpg: the Kustomization that reconciles the CloudNativePG operator and the Barman Cloud plugin.
  dependsOn:
    - name: eso-openbao
    - name: cnpg
  interval: 10m0s
  path: ./clusters/REPLACE_WITH_CLUSTER/entrypoint/private-services/openobserve/backend
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m0s
  wait: true
