apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator
  namespace: opentelemetry-operator
spec:
  interval: 30m0s
  releaseName: opentelemetry-operator
  targetNamespace: opentelemetry-operator
  timeout: 10m0s
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: opentelemetry-operator
      version: 0.129.0
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
  values:
    manager:
      # The chart default (opentelemetry-collector-k8s) lacks the contrib receivers that the
      # openobserve-collector chart uses.
      collectorImage:
        repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
        tag: 0.163.1
    admissionWebhooks:
      # Webhook certificates come from cert-manager (reconciled by the default Vanilla composition).
      # A Helm-generated certificate changes on every Flux upgrade.
      certManager:
        enabled: true
      autoGenerateCert:
        enabled: false
